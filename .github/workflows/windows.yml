name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Check release tag version
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:BUILD_REF_TYPE -eq 'tag' -and $env:BUILD_REF_NAME -ne ('v' + $packageVersion)) {
            throw 'The release tag must match the package.json version.'
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Build the renderer
        run: npm run build

      - name: Test with generated fixture images
        run: npm test

      - name: Package Windows x64 installer
        run: npm run dist:win

      - name: Generate installer checksum
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -File -Filter 'ShiguangFilm-Setup-*-x64.exe')
          if ($installers.Count -ne 1) {
            throw 'Expected exactly one Windows x64 installer.'
          }
          $installer = $installers[0]
          $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = $digest + '  ' + $installer.Name + [Environment]::NewLine
          [System.IO.File]::WriteAllText(
            (Join-Path (Resolve-Path release).Path 'SHA256SUMS'),
            $checksumLine,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload installer and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-installer
          path: |
            release/ShiguangFilm-Setup-*-x64.exe
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download this build's installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64-installer
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -File -Filter 'ShiguangFilm-Setup-*-x64.exe')
          if ($installers.Count -ne 1) {
            throw 'Expected exactly one Windows x64 installer.'
          }
          $checksum = (Resolve-Path -LiteralPath 'release/SHA256SUMS').Path
          $installer = $installers[0]
          $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content -LiteralPath $checksum -Raw).Trim()
          if ($expected -ne ($actual + '  ' + $installer.Name)) {
            throw 'Downloaded installer checksum does not match.'
          }
          $assetFiles = @($installer.FullName, $checksum)
          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $releaseInfo = $releaseJson | ConvertFrom-Json
            $existingNames = @($releaseInfo.assets | ForEach-Object { $_.name })
            $missingFiles = @($assetFiles | Where-Object {
              [System.IO.Path]::GetFileName($_) -notin $existingNames
            })
            if ($missingFiles.Count -eq 0) {
              Write-Host 'Release installer and checksum already exist; preserving them.'
            } else {
              # Reconcile a partial release without replacing existing assets.
              # A manually built installer may differ from the CI build.
              $existingDirectory = Join-Path $env:RUNNER_TEMP ('release-existing-' + [guid]::NewGuid())
              New-Item -ItemType Directory -Path $existingDirectory | Out-Null
              if ($installer.Name -in $existingNames -and 'SHA256SUMS' -notin $existingNames) {
                gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern $installer.Name --dir $existingDirectory
                if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the existing installer.' }
                $existingInstaller = Join-Path $existingDirectory $installer.Name
                $existingHash = (Get-FileHash -LiteralPath $existingInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
                [System.IO.File]::WriteAllText(
                  $checksum,
                  ($existingHash + '  ' + $installer.Name + [Environment]::NewLine),
                  [System.Text.UTF8Encoding]::new($false)
                )
              } elseif ($installer.Name -notin $existingNames -and 'SHA256SUMS' -in $existingNames) {
                gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern SHA256SUMS --dir $existingDirectory
                if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the existing checksum.' }
                $existingChecksum = (Get-Content -LiteralPath (Join-Path $existingDirectory 'SHA256SUMS') -Raw).Trim()
                if ($existingChecksum -ne ($actual + '  ' + $installer.Name)) {
                  throw 'Existing checksum differs from this build; keeping the existing release unchanged.'
                }
              }
              gh release upload $env:RELEASE_TAG @missingFiles --repo $env:GH_REPO
            }
          } else {
            gh release create $env:RELEASE_TAG @assetFiles --repo $env:GH_REPO --verify-tag --title ('拾光胶片 ' + $env:RELEASE_TAG) --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release publication failed.'
          }


